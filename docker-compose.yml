services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: warrantykeeper
    ports:
      - "5434:5432"
    volumes:
      - warrantykeeper_db_data:/var/lib/postgresql/data

volumes:
  warrantykeeper_db_data:
